name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The pipeline is stdlib-only and the suite never touches the network,
      # so there is nothing to install and nothing to rate-limit.
      - name: Run tests
        run: python -m unittest discover -s tests -v
